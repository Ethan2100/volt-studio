name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npx electron-builder --win dir --x64 --publish never

      - name: Check native modules
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse "dist/win-unpacked/resources/app.asar.unpacked" -Filter *.node |
                 Where-Object { $_.FullName -notmatch 'prebuilds' }
          if ($bad) { throw "Found a native module outside prebuilds: $($bad.FullName)" }

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        working-directory: installer
        run: |
          $package = Get-Content ../package.json -Raw | ConvertFrom-Json
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "-DVERSION=$($package.version)" installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: volt-studio-windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
