name: Build and release
on:
  workflow_dispatch:
    inputs:
      installer_version:
        description: "Volt Studio installer version"
        required: true
        default: "1.9.4"
      volt_version:
        description: "Volt language/compiler version"
        required: true
        default: "3.4.0"
      notes:
        description: "Release notes"
        required: false
        default: "Gameplay Studio, RPG authoring and Shadow Lifesteal sample."
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5
      - name: Validate independent versions
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.installer_version }}
          VOLT_VERSION: ${{ inputs.volt_version }}
        run: |
          foreach ($v in @($env:INSTALLER_VERSION, $env:VOLT_VERSION)) {
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versions must use MAJOR.MINOR.PATCH: $v" }
          }
          git fetch --tags --quiet
          if (git tag --list "v$env:INSTALLER_VERSION") { throw "Tag v$env:INSTALLER_VERSION already exists." }
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Set application and compiler versions
        shell: pwsh
        env:
          INSTALLER_VERSION: ${{ inputs.installer_version }}
          VOLT_VERSION: ${{ inputs.volt_version }}
        run: |
          npm version $env:INSTALLER_VERSION --no-git-tag-version --allow-same-version
          $file = "compiler/volt.js"
          $source = Get-Content $file -Raw
          $source = [regex]::Replace($source, "const VERSION = '[^']+';", "const VERSION = '$env:VOLT_VERSION';", 1)
          Set-Content -Path $file -Value $source -NoNewline
          node compiler/volt.js --help
      - name: Build Windows application
        run: npx electron-builder --win dir --x64 --publish never
      - name: Validate native modules
        shell: pwsh
        run: |
          $bad = Get-ChildItem -Recurse "dist/win-unpacked/resources/app.asar.unpacked" -Filter *.node |
                 Where-Object { $_.FullName -notmatch 'prebuilds' }
          if ($bad) { throw "Found native module outside prebuilds: $($bad.FullName)" }
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        working-directory: installer
        env:
          INSTALLER_VERSION: ${{ inputs.installer_version }}
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -V2 "-DVERSION=$env:INSTALLER_VERSION" installer.nsi'
      - name: Run compiler version check
        shell: pwsh
        run: |
          $version = node compiler/volt.js --help 2>&1 | Select-Object -First 1
          if ($version -notmatch [regex]::Escape("${{ inputs.volt_version }}")) { throw "Unexpected compiler version: $version" }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.installer_version }}
          name: Volt Studio Setup ${{ inputs.installer_version }} (Volt ${{ inputs.volt_version }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.exe
          body: |
            **Volt Studio installer:** ${{ inputs.installer_version }}
            **Volt language/compiler:** ${{ inputs.volt_version }}

            ${{ inputs.notes }}

            Download the Windows installer below. Windows may show SmartScreen because the installer is not code-signed.
