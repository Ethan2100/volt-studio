name: Volt Studio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/unified-game-project]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build bundled World Studio panel
        run: node plugins/world-studio/build.js
      - name: Run automated tests
        run: npm test
      - name: Build the Windows app
        run: npx electron-builder --win dir --x64 --publish never
