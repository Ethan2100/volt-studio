<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pin Diagram</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 13px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: #15171f; color: #e8eaf2; padding: 14px;
  }
  h1 { font-size: 14px; margin: 0 0 10px; }
  select {
    width: 100%; margin-bottom: 12px; padding: 7px 9px; font: inherit;
    background: #1e2130; color: #e8eaf2; border: 1px solid #2c2f42; border-radius: 7px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid #262838; font-size: 12.5px; }
  th { color: #9aa0c0; font-weight: 600; }
  td.pin { font-family: "Cascadia Code", Consolas, monospace; color: #4cc9f0; }
  .tag { display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: 5px; margin-left: 4px; }
  .tag.pwm { background: #3a2f12; color: #ffd23f; }
  .tag.analog { background: #14312f; color: #7ee787; }
  .tag.i2c { background: #2a1434; color: #c77dff; }
  .tag.builtin { background: #2a1c1c; color: #ff8a8a; }
  p.hint { color: #9aa0c0; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Pin Diagram</h1>
  <select id="board"></select>
  <table>
    <thead><tr><th>Pin</th><th>Notes</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="hint">Reference only - says nothing about your current sketch.</p>

<script>
// A sandboxed panel addon: this page runs inside its own <iframe
// sandbox="allow-scripts">, with its own origin and no access to Node,
// Electron, or the rest of Volt Studio - it only ever talks to the main
// app over postMessage (unused here; this panel is pure reference data).
const BOARDS = {
  'arduino:avr:uno': {
    label: 'Arduino Uno',
    pins: [
      ['0 (RX)', 'Serial receive - avoid using while uploading'],
      ['1 (TX)', 'Serial transmit - avoid using while uploading'],
      ['2', '<span class="tag builtin">INT0</span> external interrupt'],
      ['3', '<span class="tag pwm">PWM</span> <span class="tag builtin">INT1</span>'],
      ['5, 6, 9, 10, 11', '<span class="tag pwm">PWM</span> analogWrite-capable'],
      ['13', '<span class="tag builtin">LED_BUILTIN</span> onboard LED'],
      ['A0-A5', '<span class="tag analog">Analog in</span> 0-1023'],
      ['A4 (SDA), A5 (SCL)', '<span class="tag i2c">I2C</span> shared with analog in'],
    ],
  },
  'arduino:avr:nano': {
    label: 'Arduino Nano',
    pins: [
      ['0 (RX)', 'Serial receive'],
      ['1 (TX)', 'Serial transmit'],
      ['2, 3', 'External interrupt capable'],
      ['3, 5, 6, 9, 10, 11', '<span class="tag pwm">PWM</span>'],
      ['13', '<span class="tag builtin">LED_BUILTIN</span>'],
      ['A0-A7', '<span class="tag analog">Analog in</span>'],
      ['A4 (SDA), A5 (SCL)', '<span class="tag i2c">I2C</span>'],
    ],
  },
  'esp32:esp32:esp32': {
    label: 'ESP32 Dev Module',
    pins: [
      ['0', 'Boot-mode strap pin - avoid as output at boot'],
      ['2', 'Often tied to onboard LED on dev boards'],
      ['4, 5, 12-19, 21-23, 25-27, 32, 33', 'General I/O, most are PWM-capable'],
      ['21 (SDA), 22 (SCL)', '<span class="tag i2c">I2C</span> (default pins)'],
      ['34, 35, 36, 39', '<span class="tag analog">Analog in only</span> - no output'],
      ['6-11', 'Reserved for onboard flash - do not use'],
    ],
  },
  'rp2040:rp2040:rpipico': {
    label: 'Raspberry Pi Pico',
    pins: [
      ['0-28', 'General I/O (not all broken out on every board)'],
      ['All digital pins', '<span class="tag pwm">PWM</span> via 8 hardware PWM slices'],
      ['26, 27, 28', '<span class="tag analog">Analog in</span> (ADC0-2)'],
      ['4 (SDA), 5 (SCL)', '<span class="tag i2c">I2C0</span> (default pins)'],
      ['25', 'Onboard LED (on the Pico; varies on other RP2040 boards)'],
    ],
  },
};

const sel = document.getElementById('board');
const rows = document.getElementById('rows');
Object.entries(BOARDS).forEach(([fqbn, b]) => {
  const opt = document.createElement('option');
  opt.value = fqbn;
  opt.textContent = b.label;
  sel.appendChild(opt);
});

function render(fqbn) {
  const b = BOARDS[fqbn] || BOARDS['arduino:avr:uno'];
  rows.innerHTML = b.pins.map(([pin, notes]) =>
    `<tr><td class="pin">${pin}</td><td>${notes}</td></tr>`
  ).join('');
}

sel.addEventListener('change', () => render(sel.value));
render(sel.value);
</script>
</body>
</html>
