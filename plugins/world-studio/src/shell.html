<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Studio</title>
<style>
  :root {
    --bg: #12151c; --panel: #1a1e28; --panel2: #212633; --line: #2c3344; --text: #d9deea;
    --muted: #8590a8; --accent: #ffd23f; --accent2: #6ea8ff; --danger: #ff6b6b; --ok: #5fe0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12.5px/1.35 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- toolbar ---------- */
  #toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px 7px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .grp { display: flex; align-items: center; gap: 2px; padding-right: 6px; margin-right: 2px; border-right: 1px solid var(--line); }
  .grp:last-child { border-right: 0; }
  .tb { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
    cursor: pointer; white-space: nowrap; min-height: 26px; }
  .tb:hover:not(:disabled) { border-color: #46506a; background: #293046; }
  .tb:disabled { opacity: .4; cursor: default; }
  .tb.on { background: #3a3417; border-color: var(--accent); color: var(--accent); }
  .tb.primary { background: var(--accent); border-color: var(--accent); color: #1b1600; font-weight: 600; }
  .tb.primary:hover:not(:disabled) { background: #ffe074; }
  .tb.stop { background: var(--danger); border-color: var(--danger); color: #230000; font-weight: 600; }
  .tb kbd { opacity: .55; font: inherit; font-size: 10.5px; margin-left: 4px; }
  #toolbar select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; min-height: 26px; }
  #toolbar .lbl { color: var(--muted); margin: 0 3px 0 2px; }
  .spacer { flex: 1; }

  /* ---------- layout: wide = 3 columns, narrow = viewport + bottom dock ---------- */
  #main { flex: 1; min-height: 0; display: grid;
    grid-template-columns: 200px minmax(0, 1fr) 244px; grid-template-rows: minmax(0, 1fr) 196px;
    grid-template-areas: "explorer center props" "toolbox center props"; }
  #dock { display: contents; }
  #dockTabs { display: none; }
  #pExplorer { grid-area: explorer; } #pToolbox { grid-area: toolbox; } #pProps { grid-area: props; }
  #center { grid-area: center; }
  .pane { background: var(--panel); min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  #pProps { border-right: 0; border-left: 1px solid var(--line); }
  #pToolbox { border-top: 1px solid var(--line); }
  .pane > h3 { margin: 0; padding: 6px 9px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .pane > h3 .spacer { flex: 1; }
  .pane > h3 button { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 3px; font-size: 13px; }
  .pane > h3 button:hover { color: var(--text); }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  /* ---------- explorer ---------- */
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; border-left: 3px solid transparent; }
  .row:hover { background: #222838; }
  .row.sel { background: #2a3350; border-left-color: var(--accent2); }
  .row .ic { width: 16px; text-align: center; color: var(--muted); }
  .row.sel .ic { color: var(--accent2); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .eye { opacity: .55; cursor: pointer; padding: 0 2px; }
  .row .eye:hover { opacity: 1; }
  .row.hidden .nm { opacity: .4; text-decoration: line-through; }
  .row.world { color: var(--accent); }
  .empty { color: var(--muted); padding: 10px; }

  /* ---------- toolbox ---------- */
  #tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 7px; }
  .tool { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 2px; font-size: 11.5px; cursor: grab; text-align: center; }
  .tool:hover { border-color: var(--accent2); background: #263050; }
  .tool .g { display: block; font-size: 17px; line-height: 1.1; color: var(--accent2); }
  .tool small { color: var(--muted); }
  .hint { color: var(--muted); padding: 0 8px 8px; font-size: 11.5px; }

  /* ---------- viewport ---------- */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #000; }
  #vp { position: relative; flex: 1; min-height: 120px; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #vig { position: absolute; inset: 0; pointer-events: none; display: none; }
  #hud { position: absolute; left: 10px; top: 8px; right: 10px; pointer-events: none; color: #fff;
    text-shadow: 0 1px 3px #000; font-size: 12px; display: none; }
  #hud b { color: var(--accent); }
  #badge { position: absolute; left: 8px; bottom: 8px; pointer-events: none; background: rgba(10,12,18,.72);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--muted); }
  #status { background: var(--panel); border-top: 1px solid var(--line); padding: 4px 9px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- properties ---------- */
  #props { padding: 4px 0 12px; }
  .sec { padding: 6px 10px 2px; color: var(--accent); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .f { display: flex; align-items: center; gap: 8px; padding: 2px 10px; }
  .f > span:first-child { width: 78px; color: var(--muted); flex: none; }
  .f input[type=number], .f input[type=text] { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; user-select: text; }
  .f input:focus { outline: 1px solid var(--accent2); border-color: var(--accent2); }
  .f input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .f input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; flex: none; }
  .f input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  .f .val { width: 34px; text-align: right; color: var(--text); flex: none; }
  .colorpair { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .colorpair input[type=text] { width: 100%; font-family: Consolas, monospace; }
  .note { color: var(--muted); padding: 2px 10px 6px; font-size: 11.5px; }

  /* ---------- modal ---------- */
  #modal { position: fixed; inset: 0; background: rgba(5,7,12,.72); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 50; }
  #modal.show { display: flex; }
  #dlg { background: var(--panel); border: 1px solid #3a4360; border-radius: 12px; width: min(720px, 100%); max-height: 100%;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #dlg > header { padding: 12px 16px 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; }
  #dlg > header .spacer { flex: 1; }
  #dlg > header button { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  #dlgBody { padding: 0 16px 8px; overflow: auto; min-height: 0; }
  #dlg footer { padding: 10px 16px 14px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  #code { width: 100%; height: 230px; resize: vertical; background: #0c0e14; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; font: 11.5px/1.45 Consolas, "Courier New", monospace; color: #cfe3ff; user-select: text; white-space: pre; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 4px 0 10px; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts input { accent-color: var(--accent); }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2a3350; border: 1px solid var(--accent2);
    padding: 7px 14px; border-radius: 8px; display: none; z-index: 60; max-width: 90%; }
  #toast.err { background: #4a1f25; border-color: var(--danger); }

  /* ---------- narrow: viewport on top, tabbed dock underneath ---------- */
  @media (max-width: 800px) {
    #main { display: flex; flex-direction: column; }
    #center { flex: 1; min-height: 160px; order: 1; }
    #dock { order: 2; }
    #dock { display: flex; flex-direction: column; height: 236px; flex: none; border-top: 1px solid var(--line); background: var(--panel); }
    #dockTabs { display: flex; background: var(--panel2); border-bottom: 1px solid var(--line); }
    #dockTabs button { flex: 1; background: none; border: 0; padding: 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    #dockTabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
    .pane { border: 0 !important; flex: 1; display: none; }
    #app[data-dock="explorer"] #pExplorer, #app[data-dock="toolbox"] #pToolbox, #app[data-dock="props"] #pProps { display: flex; }
    .pane > h3 { display: none; }
  }
  @media (max-width: 460px) { .tb kbd { display: none; } }
</style>
</head>
<body>
<div id="app" data-dock="props">
  <div id="toolbar">
    <div class="grp" id="gTools">
      <button class="tb on" data-tool="select" title="Select (Q)">↖ Select</button>
      <button class="tb" data-tool="move" title="Move (W)">✥ Move</button>
      <button class="tb" data-tool="rotate" title="Rotate (E)">⟳ Rotate</button>
      <button class="tb" data-tool="scale" title="Scale (R)">⤡ Scale</button>
    </div>
    <div class="grp">
      <span class="lbl">Snap</span>
      <select id="snap" title="Grid snap in cm (rotation snaps to 15° when snap is on)">
        <option value="0">Off</option><option value="5">5</option><option value="10">10</option>
        <option value="25">25</option><option value="50" selected>50</option><option value="100">100</option>
      </select>
    </div>
    <div class="grp">
      <button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶</button>
      <button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷</button>
      <button class="tb" id="bDup" title="Duplicate (Ctrl+D)">⧉ Duplicate</button>
      <button class="tb" id="bDel" title="Delete (Del)">✕ Delete</button>
    </div>
    <div class="grp">
      <button class="tb" id="bPreview" title="See the world with its real in-game lighting, fog and flashlight">☀ Game lighting</button>
      <button class="tb primary" id="bPlay" title="Walk around your world (Esc to stop)">▶ Play</button>
    </div>
    <div class="grp">
      <button class="tb" id="bLoad" title="Load the world saved inside the current .volt file">⭳ Load from file</button>
      <button class="tb primary" id="bExport" title="Turn this world into Volt code">⭱ Export to Volt</button>
    </div>
    <div class="spacer"></div>
    <button class="tb" id="bWide" title="Make this panel wider">⤢ Wide</button>
  </div>

  <div id="main">
    <div id="dock">
      <div id="dockTabs">
        <button data-dock="explorer">Explorer</button><button data-dock="toolbox">Toolbox</button><button data-dock="props" class="on">Properties</button>
      </div>
      <section class="pane" id="pExplorer">
        <h3>Explorer <span class="spacer"></span></h3>
        <div class="scroll" id="explorer"></div>
      </section>
      <section class="pane" id="pToolbox">
        <h3>Toolbox</h3>
        <div class="scroll">
          <div id="tools"></div>
          <div class="hint">Click to add in front of the camera, or drag one into the world.</div>
        </div>
      </section>
      <section class="pane" id="pProps">
        <h3>Properties</h3>
        <div class="scroll"><div id="props"></div></div>
      </section>
    </div>

    <div id="center">
      <div id="vp">
        <canvas id="cv" tabindex="0"></canvas>
        <div id="vig"></div>
        <div id="hud"></div>
        <div id="badge">Edit</div>
      </div>
      <div id="status"></div>
    </div>
  </div>
</div>

<div id="modal"><div id="dlg"><header><span id="dlgTitle"></span><span class="spacer"></span><button id="dlgX" title="Close">✕</button></header>
  <div id="dlgBody"></div><footer id="dlgFoot"></footer></div></div>
<div id="toast"></div>

<script>/*THREE*/</script>
<script>/*STUDIO*/</script>
</body>
</html>
