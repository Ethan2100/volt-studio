<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Studio</title>
<style>
  :root {
    --bg: #12151c; --panel: #1a1e28; --panel2: #212633; --line: #2c3344; --text: #d9deea;
    --muted: #8590a8; --accent: #ffd23f; --accent2: #6ea8ff; --danger: #ff6b6b; --ok: #5fe0a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12.5px/1.35 "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ---------- toolbar: four groups, then the three things you press ---------- */
  #toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px 7px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  .grp { display: flex; align-items: center; gap: 2px; padding-right: 7px; margin-right: 3px; border-right: 1px solid var(--line); }
  .grp:last-child { border-right: 0; padding-right: 0; margin-right: 0; }
  .tb { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px;
    cursor: pointer; white-space: nowrap; min-height: 27px; }
  .tb:hover:not(:disabled) { border-color: #46506a; background: #293046; }
  .tb:disabled { opacity: .35; cursor: default; }
  .tb.on { background: #3a3417; border-color: var(--accent); color: var(--accent); }
  .tb.primary { background: var(--accent); border-color: var(--accent); color: #1b1600; font-weight: 600; }
  .tb.primary:hover:not(:disabled) { background: #ffe074; }
  .tb.stop { background: var(--danger); border-color: var(--danger); color: #230000; font-weight: 600; }
  .tb.icon { padding: 4px 8px; }
  .tb kbd { opacity: .5; font: inherit; font-size: 10.5px; margin-left: 5px; }
  #toolbar select { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; min-height: 27px; }
  #toolbar .lbl { color: var(--muted); margin: 0 4px 0 2px; }
  .spacer { flex: 1; }

  /* ---------- layout: parts | viewport | explorer over properties ---------- */
  #main { flex: 1; min-height: 0; display: grid;
    grid-template-columns: 78px minmax(0, 1fr) 252px; grid-template-rows: minmax(0, 1fr);
    grid-template-areas: "parts center side"; }
  #pParts { grid-area: parts; }
  #center { grid-area: center; }
  #side { grid-area: side; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  #pExplorer { flex: 1 1 42%; }
  #pProps { flex: 1 1 58%; border-top: 1px solid var(--line); }
  #dockTabs { display: none; }
  .pane { background: var(--panel); min-height: 0; display: flex; flex-direction: column; }
  #pParts { border-right: 1px solid var(--line); }
  .pane > h3 { margin: 0; padding: 6px 9px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); background: var(--panel2); border-bottom: 1px solid var(--line); display: flex; align-items: center; }
  .pane > h3 .spacer { flex: 1; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }

  /* ---------- the parts strip ---------- */
  #tools { display: flex; flex-direction: column; gap: 4px; padding: 6px; }
  .tool { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 2px;
    font-size: 11px; cursor: grab; text-align: center; color: var(--muted); }
  .tool:hover { border-color: var(--accent2); background: #263050; color: var(--text); }
  .tool .g { display: block; font-size: 19px; line-height: 1.15; color: var(--accent2); }

  /* ---------- explorer ---------- */
  .row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; cursor: pointer; border-left: 3px solid transparent; }
  .row:hover { background: #222838; }
  .row.sel { background: #2a3350; border-left-color: var(--accent2); }
  .row .ic { width: 16px; text-align: center; color: var(--muted); }
  .row.sel .ic { color: var(--accent2); }
  .row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .eye { opacity: .5; cursor: pointer; padding: 0 2px; }
  .row .eye:hover { opacity: 1; }
  .row.hidden .nm { opacity: .4; text-decoration: line-through; }
  .row.world { color: var(--accent); }
  .row[draggable] { cursor: grab; }
  .row.drop { outline: 1px dashed var(--accent2); outline-offset: -2px; background: #26304a; }
  .row .kids { color: var(--muted); font-size: 10.5px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 9px; padding: 0 5px; margin-left: 2px; }
  .empty { color: var(--muted); padding: 10px; line-height: 1.5; }

  /* ---------- viewport ---------- */
  #center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #000; }
  #vp { position: relative; flex: 1; min-height: 120px; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #vig { position: absolute; inset: 0; pointer-events: none; display: none; }
  #hud { position: absolute; left: 10px; top: 8px; right: 10px; pointer-events: none; color: #fff;
    text-shadow: 0 1px 3px #000; font-size: 12px; display: none; }
  #hud b { color: var(--accent); }
  #badge { position: absolute; left: 8px; bottom: 8px; pointer-events: none; background: rgba(10,12,18,.72);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--muted); }
  #status { background: var(--panel); border-top: 1px solid var(--line); padding: 4px 9px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- properties ---------- */
  #props { padding: 4px 0 14px; }
  .sec { padding: 7px 10px 2px; color: var(--accent); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .sec.adv { color: var(--muted); cursor: pointer; margin-top: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .sec.adv:hover { color: var(--text); }
  .f { display: flex; align-items: center; gap: 8px; padding: 2px 10px; }
  .f > span:first-child { width: 96px; color: var(--muted); flex: none; }
  .f input[type=number], .f input[type=text] { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; user-select: text; }
  .f input:focus { outline: 1px solid var(--accent2); border-color: var(--accent2); }
  .f input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .f input[type=color] { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 5px; background: none; cursor: pointer; flex: none; }
  .f input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; }
  .f select { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; }
  .f select:focus { outline: 1px solid var(--accent2); border-color: var(--accent2); }
  .codewrap { padding: 2px 10px 4px; }
  textarea.code { width: 100%; background: #0c0e14; border: 1px solid var(--line); border-radius: 7px; padding: 7px;
    font: 11.5px/1.5 Consolas, "Courier New", monospace; color: #cfe3ff; user-select: text; resize: vertical; white-space: pre; }
  textarea.code:focus { outline: 1px solid var(--accent2); border-color: var(--accent2); }
  .btnrow { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 10px 6px; }
  .f .val { width: 34px; text-align: right; color: var(--text); flex: none; }
  .colorpair { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .colorpair input[type=text] { width: 100%; font-family: Consolas, monospace; }
  .note { color: var(--muted); padding: 3px 10px 6px; font-size: 11.5px; line-height: 1.45; }

  /* ---------- modal, menu, help ---------- */
  #modal { position: fixed; inset: 0; background: rgba(5,7,12,.72); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 50; }
  #modal.show { display: flex; }
  #dlg { background: var(--panel); border: 1px solid #3a4360; border-radius: 12px; width: min(720px, 100%); max-height: 100%;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  #dlg > header { padding: 12px 16px 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; }
  #dlg > header .spacer { flex: 1; }
  #dlg > header button { background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  #dlgBody { padding: 0 16px 10px; overflow: auto; min-height: 0; }
  #dlgBody p { line-height: 1.5; }
  #dlg footer { padding: 10px 16px 14px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  #dlg footer:empty { padding: 0 0 8px; }
  #code { width: 100%; height: 230px; resize: vertical; background: #0c0e14; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; font: 11.5px/1.45 Consolas, "Courier New", monospace; color: #cfe3ff; user-select: text; white-space: pre; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 4px 0 10px; }
  .opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .opts input { accent-color: var(--accent); }
  .menu { display: flex; flex-direction: column; gap: 4px; margin: 2px 0 6px; }
  .menuitem { display: block; width: 100%; text-align: left; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 11px; cursor: pointer; }
  .menuitem:hover { border-color: var(--accent2); background: #263050; }
  .menuitem small { display: block; color: var(--muted); margin-top: 2px; }
  .help p { margin: 0 0 10px; }
  #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2a3350; border: 1px solid var(--accent2);
    padding: 7px 14px; border-radius: 8px; display: none; z-index: 60; max-width: 90%; }
  #toast.err { background: #4a1f25; border-color: var(--danger); }

  /* ---------- narrow: parts on top, viewport, then a tabbed dock ---------- */
  @media (max-width: 800px) {
    #main { display: flex; flex-direction: column; }
    #pParts { flex: none; border-right: 0; border-bottom: 1px solid var(--line); }
    #pParts > h3 { display: none; }
    #pParts .scroll { overflow-x: auto; overflow-y: hidden; }
    #tools { flex-direction: row; }
    .tool { flex: none; width: 62px; }
    #center { flex: 1; min-height: 150px; }
    #side { flex: none; height: 236px; border-left: 0; border-top: 1px solid var(--line); }
    #dockTabs { display: flex; background: var(--panel2); border-bottom: 1px solid var(--line); }
    #dockTabs button { flex: 1; background: none; border: 0; padding: 6px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    #dockTabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
    #side .pane { display: none; flex: 1; border-top: 0; }
    #app[data-dock="explorer"] #pExplorer, #app[data-dock="props"] #pProps { display: flex; }
    #side .pane > h3 { display: none; }
  }
  @media (max-width: 560px) { .tb kbd, .tb .word { display: none; } }
  :root { --bg:#10141d; --panel:#171d28; --panel2:#202938; --line:#303b4d; --text:#e4eaf4; --muted:#93a1b5; --accent:#72b7ff; --accent2:#8bc5ff; --danger:#ff687a; --ok:#62d6a0; }
  #app { background:var(--bg); }
  .tb { background:#263346; border-color:#3a4a60; border-radius:5px; min-height:30px; padding:5px 9px; }
  .tb:hover:not(:disabled) { background:#31445e; border-color:#6c91ba; }
  .tb.on { background:#203e5d; border-color:#6db6ff; color:#b9dcff; }
  .tb.primary { background:#2c79bd; border-color:#4a9de4; color:#fff; } .tb.primary:hover:not(:disabled) { background:#378bd2; }
  .tb.stop { background:#9d3545; border-color:#d15b6b; color:#fff; }
  #toolbar select { background:#202d3f; border-color:#3a4a60; min-height:30px; }
  #main { grid-template-columns:minmax(132px,164px) minmax(0,1fr) minmax(228px,278px); }
  #pParts { background:#171f2c; border-right:1px solid #303d50; }
  .pane > h3 { min-height:31px; padding:7px 10px; background:#202b3a; color:#b5c3d6; letter-spacing:.07em; }
  #tools { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; padding:8px; }
  .tool { min-height:61px; border-radius:6px; padding:8px 3px; background:#202c3c; border-color:#35465c; color:#c1ccda; }
  .tool .g { color:#8bc5ff; font-size:20px; } .tool:hover { background:#2a3e55; border-color:#6daee9; }
  #center { background:#090d14; } #vp { background:radial-gradient(ellipse at 50% 42%,#1d293b 0%,#101722 66%,#090d14 100%); }
  #viewportTools { position:absolute; z-index:4; top:9px; left:10px; right:10px; display:flex; align-items:center; gap:5px; pointer-events:none; }
  #viewportTools > * { pointer-events:auto; }
  .vp-group { display:flex; gap:3px; padding:3px; border:1px solid rgba(110,135,168,.35); border-radius:7px; background:rgba(15,22,33,.88); box-shadow:0 4px 14px rgba(0,0,0,.22); backdrop-filter:blur(8px); }
  .vp-btn { min-width:29px; height:27px; border:1px solid transparent; border-radius:4px; background:transparent; color:#c7d5e6; cursor:pointer; font-size:11px; padding:0 7px; }
  .vp-btn:hover { background:#2b4058; border-color:#4a688b; color:#fff; } .vp-btn.on { background:#244668; color:#b9ddff; border-color:#5389bb; }
  #viewCube { margin-left:auto; display:grid; grid-template-columns:repeat(3,25px); grid-template-rows:repeat(3,25px); gap:2px; }
  #viewCube .vp-btn { min-width:0; padding:0; font-size:10px; background:rgba(15,22,33,.9); border-color:#40536b; }
  #viewCube .blank { visibility:hidden; }
  #viewportHint { position:absolute; z-index:3; right:10px; bottom:10px; pointer-events:none; padding:5px 8px; color:#b7c5d7; background:rgba(12,18,28,.78); border:1px solid rgba(94,119,151,.35); border-radius:5px; font-size:10px; text-shadow:0 1px 2px #000; }
  #badge { bottom:10px; left:10px; border-color:#41536b; color:#d4e4f7; background:rgba(12,18,28,.86); }
  #status { min-height:25px; background:#151e2b; border-top:1px solid #303d50; color:#a9b8cb; padding:5px 10px; }
  #side { background:#171e29; border-left-color:#303d50; } #pExplorer { flex:1 1 48%; } #pProps { flex:1 1 52%; }
  #explorer { padding:5px 0 12px; } .row { min-height:25px; border-left-width:2px; padding-top:4px; padding-bottom:4px; }
  .row.sel { background:#213a56; border-left-color:#72b7ff; } .row .ic { font-size:12px; }
  .sec { color:#8bc5ff; } .f input:focus,.f select:focus { outline-color:#72b7ff; border-color:#72b7ff; }
  .f input[type=range],.f input[type=checkbox] { accent-color:#72b7ff; } .sec.adv { color:#a9b8cb; }
  .render-error { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; padding:28px; text-align:center; color:#e8eef7; background:radial-gradient(ellipse,#29374a,#101722 70%); }
  .render-error strong { font-size:18px; } .render-error span { max-width:440px; color:#b9c6d7; line-height:1.6; }
  .render-error small { max-width:90%; color:#8797ad; overflow-wrap:anywhere; }
  @media (max-width:1000px) { #main { grid-template-columns:112px minmax(0,1fr) 220px; } #tools { grid-template-columns:1fr; } }
  @media (max-width:800px) { #main { display:flex; flex-direction:column; } #pParts .scroll { overflow-x:auto; } #tools { display:flex; flex-direction:row; } #side { height:236px; } #viewportHint { display:none; } }
  @media (max-width:560px) { #projectLabel { display:none; } #viewCube { display:none; } }

  /* ================= Roblox-Studio-style ribbon, Output and tree =================
     Tabs across the top, each holding captioned groups of labelled buttons, so
     nothing is a bare glyph you have to hover to understand. */
  #ribbonTabs { display:flex; align-items:center; gap:2px; padding:0 8px; min-height:28px;
    background:#111722; border-bottom:1px solid #2b3545; }
  .rtab { background:none; border:0; border-bottom:2px solid transparent; padding:5px 13px 4px;
    color:var(--muted); cursor:pointer; font-size:12px; border-radius:4px 4px 0 0; }
  .rtab:hover { color:var(--text); background:#1a2332; }
  .rtab.on { color:var(--accent); border-bottom-color:var(--accent); background:#192231; }
  #ribbonTabs .spacer { flex:1; }
  #projectLabel { color:#6f7f94; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #toolbar { display:block; min-height:0; padding:0; overflow:visible; border-bottom:1px solid #354257; background:#192231; }
  .rpage { display:none; align-items:stretch; gap:0; padding:4px 8px 2px; }
  .rpage.on { display:flex; flex-wrap:wrap; }
  .rpage .grp { display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:0 9px; margin:0; border-right:1px solid #2b3545; }
  .rpage .grp:last-child { border-right:0; }
  .rpage .grow { display:flex; align-items:center; gap:3px; }
  .gcap { font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:#6f7f94; padding-bottom:1px; }

  /* ---------- Output ---------- */
  #pOutput { flex:none; border-top:1px solid #303d50; background:#151e2b; }
  #pOutput > h3 { cursor:pointer; gap:7px; }
  #pOutput[data-open="0"] #outLog { display:none; }
  #pOutput[data-open="1"] { height:150px; }
  #pOutput #outLog { padding:4px 0 6px; font:11.5px/1.5 Consolas,"Courier New",monospace; }
  #outCount { color:#6f7f94; letter-spacing:0; text-transform:none; font-size:10.5px; }
  #outCaret { color:var(--muted); }
  #pOutput[data-open="1"] #outCaret { transform:rotate(180deg); display:inline-block; }
  #pOutput h3 .tb { min-height:19px; padding:1px 7px; font-size:10.5px; }
  .logline { padding:1px 10px; color:#b7c5d7; white-space:pre-wrap; word-break:break-word; user-select:text; }
  .logline time { color:#64748c; margin-right:7px; }
  .logline.err { color:#ff9aa6; } .logline.ok { color:#7fe0b0; }
  #outLog .empty { font-family:"Segoe UI",system-ui,sans-serif; }

  /* ---------- the Things tree ---------- */
  .pane > h3 .hint { font-size:9.5px; letter-spacing:0; text-transform:none; color:#5d6c80; }
  .row .caret { width:12px; flex:none; text-align:center; color:#7d8ca1; font-size:9px; cursor:pointer; }
  .row .caret:hover { color:var(--text); }
  .row .caret.leaf { visibility:hidden; }
  #ctx { position:fixed; z-index:70; display:none; min-width:176px; padding:4px;
    background:#1d2736; border:1px solid #3d4c63; border-radius:8px; box-shadow:0 12px 34px rgba(0,0,0,.5); }
  #ctx.show { display:block; }
  #ctx button { display:block; width:100%; text-align:left; background:none; border:0; border-radius:5px;
    padding:5px 9px; color:var(--text); cursor:pointer; font-size:12px; }
  #ctx button:hover { background:#2b4058; }
  #ctx button:disabled { color:#5d6c80; cursor:default; background:none; }
  #ctx hr { border:0; border-top:1px solid #303d50; margin:3px 2px; }
  #ctx .danger:hover { background:#4a1f25; color:#ffb3bc; }

  /* ---------- Properties: collapsible categories ---------- */
  .cat { border-bottom:1px solid #232e3e; }
  .cathead { display:flex; align-items:center; gap:6px; padding:6px 10px 5px; cursor:pointer;
    color:#8bc5ff; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; background:#1b2534; }
  .cathead:hover { background:#223047; }
  .cathead .caret { font-size:9px; color:#7d8ca1; }
  .cat.shut .catbody { display:none; }
  .catbody { padding:3px 0 6px; }

  @media (max-width:700px) { .gcap { display:none; } .rpage .grp { flex-direction:row; padding:0 6px; } }
  #badge.warn { background:#43361a; border-color:#7a6326; color:#ffd98a; max-width:none; }
</style>
</head>
<body>
<div id="app" data-dock="props">
  <div id="ribbonTabs">
    <button class="rtab on" data-rtab="home">Home</button>
    <button class="rtab" data-rtab="build">Build</button>
    <button class="rtab" data-rtab="view">View</button>
    <span class="spacer"></span>
    <span id="projectLabel">World Studio</span>
  </div>
  <div id="toolbar">
    <div class="rpage on" data-rpage="home">
      <div class="grp">
        <div class="grow">
          <button class="tb" id="bUndo" title="Undo (Ctrl+Z)">↶<span class="word"> Undo</span></button>
          <button class="tb" id="bRedo" title="Redo (Ctrl+Y)">↷<span class="word"> Redo</span></button>
          <button class="tb" id="bDup" title="Make a copy (Ctrl+D)">⧉<span class="word"> Copy</span></button>
          <button class="tb" id="bDel" title="Delete (Del)">✕<span class="word"> Delete</span></button>
        </div>
        <div class="gcap">Edit</div>
      </div>
      <div class="grp" id="gTools">
        <div class="grow">
          <button class="tb on" data-tool="select" title="Pick things and slide them around">↖<span class="word"> Pick</span><kbd>Q</kbd></button>
          <button class="tb" data-tool="move" title="Drag an arrow to move">✥<span class="word"> Move</span><kbd>W</kbd></button>
          <button class="tb" data-tool="rotate" title="Drag the ring to turn">⟳<span class="word"> Turn</span><kbd>E</kbd></button>
          <button class="tb" data-tool="scale" title="Drag a handle to resize">⤡<span class="word"> Size</span><kbd>R</kbd></button>
        </div>
        <div class="gcap">Tools</div>
      </div>
      <div class="grp">
        <div class="grow">
          <select id="snap" title="Round everything off to this many cm, so walls line up (turning snaps to 15°)">
            <option value="0">Off</option><option value="5">5 cm</option><option value="10">10 cm</option>
            <option value="25">25 cm</option><option value="50" selected>50 cm</option><option value="100">100 cm</option>
          </select>
        </div>
        <div class="gcap">Grid</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb primary" id="bPlay" title="Walk around your world (Esc to stop)">▶ Play</button>
          <button class="tb" id="bLight" title="Game lighting: see the real fog, darkness and flashlight">☀<span class="word"> Lighting</span></button>
        </div>
        <div class="gcap">Playtest</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb primary" id="bSave" title="Write this world into your .volt file (your own code is kept)">⭳ Save world</button>
          <button class="tb" id="bSavePlay" title="Save it and run the game in Volt Studio">▶<span class="word"> Save &amp; run</span></button>
          <button class="tb" id="bMore" title="Everything else">⋯</button>
        </div>
        <div class="gcap">Game file</div>
      </div>
    </div>
    <div class="rpage" data-rpage="build">
      <div class="grp">
        <div class="grow">
          <button class="tb" id="bRoom" title="Four walls, a floor, a light and a spawn point">⬚ Small room</button>
          <button class="tb" id="bEmpty" title="Nothing but a spawn point">□ Empty world</button>
        </div>
        <div class="gcap">Start again</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb" id="bFolder" title="Put the picked thing in a new folder, so a building or prop moves as one (Ctrl+G)">📁 Put in a folder</button>
          <button class="tb" id="bUnparent" title="Take the picked thing out of whatever it sits inside">⤒ Move out to World</button>
        </div>
        <div class="gcap">Picked thing</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb" id="bLoad" title="Read the world back out of the .volt file in the editor">⭱ Load world</button>
          <button class="tb" id="bCode" title="Copy it, insert it, or paste just the world into another game">&lt;/&gt; Show Volt code</button>
        </div>
        <div class="gcap">Game file</div>
      </div>
    </div>
    <div class="rpage" data-rpage="view">
      <div class="grp">
        <div class="grow">
          <button class="tb" id="vFrame" title="Frame all objects">⬜ Frame all</button>
          <button class="tb" id="vFocus" title="Focus selected object (F)">◎ Focus</button>
          <button class="tb" id="vZoomOut" title="Zoom out">−</button>
          <button class="tb" id="vZoomIn" title="Zoom in">+</button>
        </div>
        <div class="gcap">Camera</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb on" id="vGrid" title="Show or hide the grid">⋯ Grid</button>
          <button class="tb on" id="vAxes" title="Show or hide the axes">✛ Axes</button>
        </div>
        <div class="gcap">Show</div>
      </div>
      <div class="grp">
        <div class="grow">
          <button class="tb" id="bOutput" title="Show or hide the Output messages">⌸ Output</button>
          <button class="tb" id="bWide" title="More room for the viewport">⬌ Wide panel</button>
        </div>
        <div class="gcap">Panels</div>
      </div>
    </div>
  </div>
  <div id="main">
    <section class="pane" id="pParts">
      <h3>Parts</h3>
      <div class="scroll"><div id="tools"></div></div>
    </section>

    <div id="center">
      <div id="vp">
        <canvas id="cv" tabindex="0"></canvas>
        <div id="vig"></div>
        <div id="hud"></div>
        <div id="viewportTools">
          <div id="viewCube" class="vp-group" aria-label="Camera views">
            <span class="vp-btn blank"></span><button class="vp-btn" data-view="top" title="Top view">TOP</button><span class="vp-btn blank"></span>
            <button class="vp-btn" data-view="left" title="Left view">L</button><button class="vp-btn" data-view="front" title="Front view">F</button><button class="vp-btn" data-view="right" title="Right view">R</button>
            <span class="vp-btn blank"></span><button class="vp-btn" data-view="back" title="Back view">B</button><span class="vp-btn blank"></span>
          </div>
        </div>
        <div id="viewportHint">Right-drag: look · Middle-drag: pan · Scroll: zoom · F: focus</div>
        <div id="badge">Edit</div>
      </div>
      <section class="pane" id="pOutput" data-open="0">
        <h3 id="outHead">Output<span id="outCount"></span><span class="spacer"></span><button class="tb" id="bOutClear" title="Clear the messages">Clear</button><span id="outCaret">▴</span></h3>
        <div class="scroll" id="outLog"></div>
      </section>
      <div id="status"></div>
    </div>

    <div id="side">
      <div id="dockTabs">
        <button data-dock="explorer">Things</button><button data-dock="props" class="on">Properties</button>
      </div>
      <section class="pane" id="pExplorer">
        <h3>Things <span class="spacer"></span><span class="hint">right-click a row</span></h3>
        <div class="scroll" id="explorer"></div>
      </section>
      <section class="pane" id="pProps">
        <h3>Properties</h3>
        <div class="scroll"><div id="props"></div></div>
      </section>
    </div>
  </div>
</div>

<div id="modal"><div id="dlg"><header><span id="dlgTitle"></span><span class="spacer"></span><button id="dlgX" title="Close">✕</button></header>
  <div id="dlgBody"></div><footer id="dlgFoot"></footer></div></div>
<div id="ctx"></div>
<div id="toast"></div>

<script>/*THREE*/</script>
<script>/*STUDIO*/</script>
</body>
</html>
